<div class="container mt-4">
  <div class="card shadow border-0 rounded-4 p-4">
    <div class="card-body">
      <h3 class="card-title text-success mb-4 fw-bold">Modifier l'Animal</h3>

      <form>
        <div class="mb-3">
          <label class="form-label fw-semibold">ID Animal</label>
          <input
            readonly
            type="number"
            [(ngModel)]="currentAnimal.idAnimal"
            name="idAnimal"
            class="form-control rounded-3"
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Nom de l'Animal</label>
          <input
            type="text"
            [(ngModel)]="currentAnimal.nomAnimal"
            name="nomAnimal"
            class="form-control rounded-3"
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Espèce</label>
          <input
            type="text"
            [(ngModel)]="currentAnimal.especeAnimal"
            name="especeAnimal"
            class="form-control rounded-3"
          />
        </div>

        <!-- Sélection du groupe -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Groupe</label>
          <select
            class="form-control form-control-lg rounded-3"
            id="idGroupe"
            name="idGroupe"
            [(ngModel)]="updatedIdGroupe"
          >
            @for (g of groupes; track g.idGroupe) {
              <option [value]="g.idGroupe">{{ g.nomGroupe }}</option>
            }
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Date de Naissance</label>
          <input
            type="date"
            [ngModel]="currentAnimal.dateNaissance | date: 'yyyy-MM-dd'"
            (ngModelChange)="currentAnimal.dateNaissance = $event"
            name="dateNaissance"
            class="form-control rounded-3"
          />
        </div>

        <div class="d-grid gap-2">
          <button type="submit" (click)="updateAnimal()" class="btn btn-success btn-lg rounded-3">
            Mettre à jour
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
